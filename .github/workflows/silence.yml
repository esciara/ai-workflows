# Reusable: Workflow B, B2 reporter silence (WP7, spec: Reporter silence). Called from the caller's daily schedule and
# manual runs, when `workflows.triage` is on. No agent and no model token; both jobs hold only `issues: write` (no
# `actions: write` or `actions: read`, so actions/stale keeps no state between runs) and run in order in one run:
# 1. ping: on silent needs-info issues, a comment mentioning the maintainers and the `triage: no-response` label
#    (aiwf silence-ping; reads labels, comment authors, dates and markers only, never issue text);
# 2. stale: actions/stale labels `stale` and closes, only on issues already pinged, so the order is always ping, stale,
#    close. Its clock counts from the last update (the ping is one), hence `stale - ping` days to the label. Then
#    aiwf silence-closed takes `triage: no-response` and `stale` off the issues it closed (numbers only), so a
#    maintainer who reopens one is not overruled ~17 days later (aiwf-9ni).
name: ai-workflows reporter silence
on:
  workflow_call:
    inputs:
      config:
        description: Normalised config JSON (output of config.yml)
        type: string
        required: true
      labels:
        description: Extra labels an issue must also carry to be handled, comma-separated (empty in the caller template)
        type: string
        default: ''

# Least privilege by default (ADR-0038); each job grants what it needs.
permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    outputs:
      only_labels: ${{ steps.ping.outputs.only_labels }}
      stale_after: ${{ steps.ping.outputs.stale_after }}
      close_after: ${{ steps.ping.outputs.close_after }}
      stale_days: ${{ steps.ping.outputs.stale_days }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ai-workflows
          persist-credentials: false
      - uses: ./.ai-workflows/.github/actions/aiwf-setup
      - id: ping
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          AIWF_CONFIG: ${{ inputs.config }}
          EXTRA_LABELS: ${{ inputs.labels }}
        run: aiwf silence-ping --repo "$REPO" --labels "$EXTRA_LABELS"

  # Never without the scope: actions/stale with empty only-issue-labels would handle every open issue.
  stale:
    needs: ping
    if: needs.ping.outputs.only_labels != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - id: stale
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          only-issue-labels: ${{ needs.ping.outputs.only_labels }}
          exempt-issue-labels: 'keep-open,ai: off,ai: error'
          days-before-issue-stale: ${{ needs.ping.outputs.stale_after }}
          days-before-issue-close: ${{ needs.ping.outputs.close_after }}
          stale-issue-label: 'stale'
          remove-stale-when-updated: true
          close-issue-reason: 'not_planned'
          stale-issue-message: >-
            No reply for ${{ needs.ping.outputs.stale_days }} days. This issue will close in
            ${{ needs.ping.outputs.close_after }} days unless the details requested above are added.
          close-issue-message: >-
            Closed for lack of a reply. Add the requested details
            in a comment and a maintainer will reopen it.
          days-before-pr-stale: -1
          days-before-pr-close: -1
      - if: steps.stale.outputs.closed-issues-prs != '' && steps.stale.outputs.closed-issues-prs != '[]'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ai-workflows
          persist-credentials: false
      - if: steps.stale.outputs.closed-issues-prs != '' && steps.stale.outputs.closed-issues-prs != '[]'
        uses: ./.ai-workflows/.github/actions/aiwf-setup
      - if: steps.stale.outputs.closed-issues-prs != '' && steps.stale.outputs.closed-issues-prs != '[]'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          AIWF_CLOSED: ${{ steps.stale.outputs.closed-issues-prs }}
        run: aiwf silence-closed --repo "$REPO"
