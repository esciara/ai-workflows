# Reusable: load and validate the caller repo's .github/ai-workflows.yml.
# The config is read from the repo's default branch via the API, never from a PR head.
# Exception (ADR-0028): the playground's e2e caller passes `e2e_config`; then the file comes from tests/e2e/config/
# of this workflow's own commit (job.workflow_sha), so a WP branch on `e2e-target` carries its own e2e config.
name: ai-workflows config
on:
  workflow_call:
    inputs:
      config_path:
        type: string
        default: .github/ai-workflows.yml
      config_ref:
        description: Read the config from this ref instead of the default branch. Honoured only on workflow_dispatch runs.
        type: string
        default: ''
      e2e_config:
        description: e2e caller only (ADR-0028). File name in tests/e2e/config/ of this workflow's commit, used instead of the repo's config.
        type: string
        default: ''
    outputs:
      config:
        description: Normalised config as JSON (defaults applied)
        value: ${{ jobs.load.outputs.config }}
      enabled:
        value: ${{ jobs.load.outputs.enabled }}
      review:
        description: "'true' when enabled and workflows.review"
        value: ${{ jobs.load.outputs.review }}
      triage:
        description: "'true' when enabled and workflows.triage"
        value: ${{ jobs.load.outputs.triage }}

# Least privilege by default (ADR-0017); each job grants what it needs.
permissions: {}

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      config: ${{ steps.cfg.outputs.config }}
      enabled: ${{ steps.cfg.outputs.enabled }}
      review: ${{ steps.cfg.outputs.review }}
      triage: ${{ steps.cfg.outputs.triage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ai-workflows
          persist-credentials: false
      - id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # Cached venv, keyed on the dependency file at job.workflow_sha; aiwf itself is an editable install, so its code
      # always comes from the checkout above (ADR-0019), never from the cache.
      - id: venv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.aiwf-venv
          key: aiwf-venv-v1-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('.ai-workflows/pyproject.toml') }}
      - if: steps.venv.outputs.cache-hit != 'true'
        run: python -m venv ~/.aiwf-venv && ~/.aiwf-venv/bin/pip install --quiet -e ./.ai-workflows
      - run: echo "$HOME/.aiwf-venv/bin" >> "$GITHUB_PATH"
      - id: cfg
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CONFIG_PATH: ${{ inputs.config_path }}
          CONFIG_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.config_ref || '' }}
          E2E_CONFIG: ${{ inputs.e2e_config }}
        run: aiwf config --repo "$REPO" --path "$CONFIG_PATH" --ref "$CONFIG_REF" --e2e-config "$E2E_CONFIG"
