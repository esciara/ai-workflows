# Reusable: load and validate the caller repo's .github/ai-workflows.yml.
# The config is read from the repo's default branch via the API, never from a PR head.
# On issue_comment it also parses the comment, once per run (ADR-0005): `command` is the accepted command from a fixed
# list (review, retriage, reproduce, fix, no-fix) or ''. The comment is read from $GITHUB_EVENT_PATH as data.
name: ai-workflows config
on:
  workflow_call:
    inputs:
      config_path:
        type: string
        default: .github/ai-workflows.yml
      config_ref:
        description: Read the config from this ref instead of the default branch. Honoured only on workflow_dispatch runs.
        type: string
        default: ''
    outputs:
      config:
        description: Normalised config as JSON (defaults applied)
        value: ${{ jobs.load.outputs.config }}
      enabled:
        value: ${{ jobs.load.outputs.enabled }}
      review:
        description: "'true' when enabled and workflows.review"
        value: ${{ jobs.load.outputs.review }}
      triage:
        description: "'true' when enabled and workflows.triage"
        value: ${{ jobs.load.outputs.triage }}
      command:
        description: "Slash command accepted from the comment (maintainer with write access), or ''; also in config JSON"
        value: ${{ jobs.load.outputs.command }}

# Least privilege by default (ADR-0038); each job grants what it needs.
permissions: {}

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      config: ${{ steps.cfg.outputs.config }}
      enabled: ${{ steps.cfg.outputs.enabled }}
      review: ${{ steps.cfg.outputs.review }}
      triage: ${{ steps.cfg.outputs.triage }}
      command: ${{ steps.cfg.outputs.command }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ai-workflows
          persist-credentials: false
      - uses: ./.ai-workflows/.github/actions/aiwf-setup
      - id: cfg
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CONFIG_PATH: ${{ inputs.config_path }}
          CONFIG_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.config_ref || '' }}
        run: aiwf config --repo "$REPO" --path "$CONFIG_PATH" --ref "$CONFIG_REF"
