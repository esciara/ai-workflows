# Workflow A on this repo (ADR-0051). Reviews every same-repo PR with the reusable workflow from main (never the PR's
# own copy). `verdict` passes on `ai-review: merge` or on the maintainer's approval of the head commit (ADR-0053).
# `verdict` is a required check of the ruleset; it must be a job of this run: labels added with GITHUB_TOKEN start no
# other workflow run.
name: AI review
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:   # re-evaluates `verdict` only (no new AI review): an approval or a dismissal changes the answer
    types: [submitted, dismissed]
  workflow_dispatch: {}   # once after install: create the label set

concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

permissions: {}

jobs:
  config:
    if: github.event_name != 'pull_request_review'
    uses: esciara/ai-workflows/.github/workflows/config.yml@main
    permissions:
      contents: read

  labels:
    needs: config
    if: needs.config.outputs.enabled == 'true' && github.event_name == 'workflow_dispatch'
    uses: esciara/ai-workflows/.github/workflows/labels.yml@main
    permissions:
      issues: write

  review:
    needs: config
    if: needs.config.outputs.review == 'true' && github.event_name == 'pull_request'
    uses: esciara/ai-workflows/.github/workflows/review.yml@main
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: read
    with:
      config: ${{ needs.config.outputs.config }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  # Required check, green when this PR's label is `ai-review: merge` (set by this run's review) or when the owner has
  # approved the head commit (ADR-0053). On pull_request_review the review job is skipped and the labels may belong to
  # an older head commit, so only approvals of the head SHA are read there. A new push changes the head SHA, so an old
  # approval no longer counts. Never approves anything.
  verdict:
    needs: review
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'pull_request_review')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT: ${{ github.event_name }}
          REVIEW: ${{ needs.review.result }}
        run: |
          # Latest review per user, kept when APPROVED on the head commit by the repository owner.
          approved=$(gh api --paginate "repos/$REPO/pulls/$PR/reviews" --jq '.[]' | jq -rs --arg sha "$HEAD_SHA" '
            map(select(.state != "COMMENTED" and .state != "PENDING")) | group_by(.user.login) | map(last)
            | map(select(.state == "APPROVED" and .commit_id == $sha and .author_association == "OWNER"))
            | map(.user.login) | join(",")')
          if [ -n "$approved" ]; then echo "approved on $HEAD_SHA by: $approved"; exit 0; fi
          if [ "$EVENT" = pull_request ] && [ "$REVIEW" != success ]; then
            echo "review did not succeed ($REVIEW) and no owner approval of $HEAD_SHA"; exit 1
          fi
          if [ "$EVENT" != pull_request ]; then
            echo "no owner approval of $HEAD_SHA (labels are not trusted outside a pull_request run)"; exit 1
          fi
          labels=$(gh api "repos/$REPO/issues/$PR/labels" --jq '.[].name')
          echo "$labels"
          if ! grep -qx 'ai-review: merge' <<<"$labels"; then
            echo "verdict is not ai-review: merge and no owner approval of $HEAD_SHA"; exit 1
          fi
