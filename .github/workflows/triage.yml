# Reusable: Workflow B (issue triage and fixes). WP5: B1 classify on `issues.opened` and on a maintainer's `/retriage`.
# WP6: B2 reproduce (ADR-0037), after B1 for a trusted author's bug, on a maintainer's `/reproduce`, or on the reporter's
# reply while the issue has `triage: needs-info`. The reproducer runs project commands: sandboxed Bash only, env scrubbed.
# B1 runs two agent passes (ADR-0035): pass 1 reads the issue and returns what to search for; the orchestrator gathers
# duplicate candidates (issue search, all issues) and possible fixes (commits and merged PRs since the reported
# version's tag) with a read-only token; pass 2 classifies. Issue and comment text are untrusted: they reach scripts
# through env vars or the API, and the agents as inline context in their prompts. Agent jobs hold no GitHub token
# scope, no file tools and no secret but the OAuth token (ADR-0003, ADR-0012, ADR-0018); only the publish job writes,
# after checking each agent's JSON against its schema.
name: ai-workflows triage
on:
  workflow_call:
    inputs:
      config:
        description: Normalised config JSON (output of config.yml)
        type: string
        required: true
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      SLACK_WEBHOOK_URL:
        required: false
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false

# Least privilege by default (ADR-0017); each job grants what it needs.
permissions: {}

jobs:
  # Which events run B1: a new issue, or `/retriage` from a maintainer (ADR-0005) on an issue (not a PR). Which run B2
  # directly: `/reproduce` from a maintainer, or a reply (not a command) from the issue's author while it has
  # `triage: needs-info`, which only B2 sets, so only after a trusted start (ADR-0037).
  gate:
    if: github.event_name == 'issues' || (github.event_name == 'issue_comment' && !github.event.issue.pull_request)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      classify: ${{ github.event_name == 'issues' || steps.parse.outputs.command == 'retriage' }}
      reproduce: "${{ steps.parse.outputs.command == 'reproduce' || (github.event_name == 'issue_comment' && steps.parse.outputs.command == '' && github.event.comment.user.login == github.event.issue.user.login && contains(github.event.issue.labels.*.name, 'triage: needs-info')) }}"
    steps:
      - if: github.event_name == 'issue_comment'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ai-workflows
          persist-credentials: false
      - if: github.event_name == 'issue_comment'
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # Cached venv, keyed on the dependency file at job.workflow_sha; aiwf itself is an editable install, so its code
      # always comes from the checkout above (ADR-0019), never from the cache.
      - if: github.event_name == 'issue_comment'
        id: venv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.aiwf-venv
          key: aiwf-venv-v1-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('.ai-workflows/pyproject.toml') }}
      - if: github.event_name == 'issue_comment' && steps.venv.outputs.cache-hit != 'true'
        run: python -m venv ~/.aiwf-venv && ~/.aiwf-venv/bin/pip install --quiet -e ./.ai-workflows
      - if: github.event_name == 'issue_comment'
        id: parse
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          AIWF_CONFIG: ${{ inputs.config }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
        run: ~/.aiwf-venv/bin/aiwf parse-command --repo "$REPO"

  # B1 pass-1 context with a read-only token: the issue under triage.
  context:
    needs: gate
    if: needs.gate.outputs.classify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      # e2e only (ADR-0045): with the playground's e2e config, the label `e2e-crash` forces a crash here.
      - if: fromJSON(inputs.config).e2e && (contains(github.event.issue.labels.*.name, 'e2e-crash') || contains(github.event.pull_request.labels.*.name, 'e2e-crash'))
        run: echo "::error::forced crash (label e2e-crash, e2e config only)" && exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ai-workflows
          persist-credentials: false
      - id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - id: venv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.aiwf-venv
          key: aiwf-venv-v1-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('.ai-workflows/pyproject.toml') }}
      - if: steps.venv.outputs.cache-hit != 'true'
        run: python -m venv ~/.aiwf-venv && ~/.aiwf-venv/bin/pip install --quiet -e ./.ai-workflows
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: ~/.aiwf-venv/bin/aiwf triage-issue --repo "$REPO" --issue "$ISSUE" --out issue.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: triage-issue
          path: issue.md
          retention-days: 7

  # B1 pass 1 (extractor): reported version, search phrases, file paths. No tools but StructuredOutput; the issue is in
  # the prompt. The artifact comes from this run without a token (download-artifact has no token default).
  extract:
    needs: context
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    env:
      # Per-agent cost budget (ADR-0045); the e2e-only label `e2e-budget` makes it near zero (playground e2e config only).
      AGENT_BUDGET: ${{ fromJSON(inputs.config).e2e && contains(github.event.issue.labels.*.name, 'e2e-budget') && '0.0001' || fromJSON(inputs.config).limits.agent_budget_usd }}
    outputs:
      json: ${{ steps.claude.outputs.structured_output }}
      usage: ${{ steps.usage.outputs.usage }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: triage-issue
      - env:
          AIWF_REPO: ${{ job.workflow_repository }}
          AIWF_SHA: ${{ job.workflow_sha }}
        run: |
          # Prompt and schema come from the commit this workflow file came from (ADR-0019), fetched without credentials.
          git init --quiet .ai-workflows
          git -C .ai-workflows fetch --quiet --depth 1 "https://github.com/$AIWF_REPO.git" "$AIWF_SHA"
          git -C .ai-workflows checkout --quiet FETCH_HEAD
          { cat .ai-workflows/prompts/extractor.md; echo; cat issue.md; } > prompt.md
          # Claude's --json-schema rejects the draft 2020-12 `$schema` key; the orchestrator validates against the full file.
          echo "SCHEMA=$(jq -c 'del(."$schema")' .ai-workflows/schema/extractor.json)" >> "$GITHUB_ENV"
          echo "AGENT_START=$(date +%s)" >> "$GITHUB_ENV"
      - id: claude
        timeout-minutes: ${{ fromJSON(inputs.config).limits.agent_minutes }}  # wall-clock budget (ADR-0045)
        uses: anthropics/claude-code-action/base-action@6d5ae526d25ce88daa2200be073e1a373167f064 # v1.0.265
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt_file: prompt.md
          claude_args: >-
            --max-turns 3
            --tools StructuredOutput
            --json-schema '${{ env.SCHEMA }}'
            --max-budget-usd ${{ env.AGENT_BUDGET }}
      # This agent's usage, read by publish for the budget check (ADR-0045).
      - id: usage
        if: always()
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          OUTCOME: ${{ steps.claude.outcome }}
          AGENT_MINUTES: ${{ fromJSON(inputs.config).limits.agent_minutes }}
        run: echo "usage=$(bash .ai-workflows/scripts/agent-usage.sh)" >> "$GITHUB_OUTPUT"

  # Candidates with a read-only token, after checking pass 1's JSON against its schema: duplicate candidates from issue
  # search over all issues, possible fixes from commits and merged PRs since the reported version's tag (ADR-0035).
  candidates:
    needs: extract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      range_confidence: ${{ steps.gather.outputs.range_confidence }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ai-workflows
          persist-credentials: false
      - id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - id: venv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.aiwf-venv
          key: aiwf-venv-v1-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('.ai-workflows/pyproject.toml') }}
      - if: steps.venv.outputs.cache-hit != 'true'
        run: python -m venv ~/.aiwf-venv && ~/.aiwf-venv/bin/pip install --quiet -e ./.ai-workflows
      - id: gather
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          AIWF_CONFIG: ${{ inputs.config }}
          EXTRACT_JSON: ${{ needs.extract.outputs.json }}
        run: ~/.aiwf-venv/bin/aiwf triage-candidates --repo "$REPO" --issue "$ISSUE" --out context.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: triage-context
          path: context.md
          retention-days: 7

  # B1 pass 2 (classifier): class, duplicate, possible fix. No tools but StructuredOutput; issue and candidates inline.
  classify:
    needs: candidates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    env:
      # Per-agent cost budget (ADR-0045); the e2e-only label `e2e-budget` makes it near zero (playground e2e config only).
      AGENT_BUDGET: ${{ fromJSON(inputs.config).e2e && contains(github.event.issue.labels.*.name, 'e2e-budget') && '0.0001' || fromJSON(inputs.config).limits.agent_budget_usd }}
    outputs:
      json: ${{ steps.claude.outputs.structured_output }}
      usage: ${{ steps.usage.outputs.usage }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: triage-context
      - env:
          AIWF_REPO: ${{ job.workflow_repository }}
          AIWF_SHA: ${{ job.workflow_sha }}
        run: |
          # Prompt and schema come from the commit this workflow file came from (ADR-0019), fetched without credentials.
          git init --quiet .ai-workflows
          git -C .ai-workflows fetch --quiet --depth 1 "https://github.com/$AIWF_REPO.git" "$AIWF_SHA"
          git -C .ai-workflows checkout --quiet FETCH_HEAD
          { cat .ai-workflows/prompts/classifier.md; echo; cat context.md; } > prompt.md
          # Claude's --json-schema rejects the draft 2020-12 `$schema` key; the orchestrator validates against the full file.
          echo "SCHEMA=$(jq -c 'del(."$schema")' .ai-workflows/schema/classifier.json)" >> "$GITHUB_ENV"
          echo "AGENT_START=$(date +%s)" >> "$GITHUB_ENV"
      - id: claude
        timeout-minutes: ${{ fromJSON(inputs.config).limits.agent_minutes }}  # wall-clock budget (ADR-0045)
        uses: anthropics/claude-code-action/base-action@6d5ae526d25ce88daa2200be073e1a373167f064 # v1.0.265
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt_file: prompt.md
          claude_args: >-
            --max-turns 3
            --tools StructuredOutput
            --json-schema '${{ env.SCHEMA }}'
            --max-budget-usd ${{ env.AGENT_BUDGET }}
      # This agent's usage, read by publish for the budget check (ADR-0045).
      - id: usage
        if: always()
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          OUTCOME: ${{ steps.claude.outcome }}
          AGENT_MINUTES: ${{ fromJSON(inputs.config).limits.agent_minutes }}
        run: echo "usage=$(bash .ai-workflows/scripts/agent-usage.sh)" >> "$GITHUB_OUTPUT"

  # Labels and the one triage comment, from the checked JSON; invalid output gives `ai: error` and nothing else.
  publish:
    needs: [context, extract, candidates, classify]
    if: always() && needs.context.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      budget: ${{ steps.publish.outputs.budget }}
      reproduce: ${{ steps.publish.outputs.reproduce }}  # a trusted author's bug goes on to B2 (ADR-0037)
    permissions:
      contents: read  # check a fixing commit is on the default branch
      issues: write
      pull-requests: read  # check a fixing PR was merged into the default branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ai-workflows
          persist-credentials: false
      - id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - id: venv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.aiwf-venv
          key: aiwf-venv-v1-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('.ai-workflows/pyproject.toml') }}
      - if: steps.venv.outputs.cache-hit != 'true'
        run: python -m venv ~/.aiwf-venv && ~/.aiwf-venv/bin/pip install --quiet -e ./.ai-workflows
      - id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          AGENT_JSON: ${{ needs.classify.outputs.json }}
          EXTRACT_JSON: ${{ needs.extract.outputs.json }}  # its suspicious_instructions are reported too
          AIWF_CONFIG: ${{ inputs.config }}
          AIWF_USAGE: ${{ format('{{"extract":{0},"classify":{1}}}', needs.extract.outputs.usage || 'null', needs.classify.outputs.usage || 'null') }}
          AIWF_FIX_RANGE_CONFIDENCE: ${{ needs.candidates.outputs.range_confidence }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ~/.aiwf-venv/bin/aiwf publish --kind classifier --repo "$REPO" --issue "$ISSUE" --run-url "$RUN_URL"

  # B2 context with a read-only token: the issue and the comments that matter, the project's commands, and the default
  # branch's code (persist-credentials false: no token is left in the tarball's .git).
  repro-context:
    needs: [gate, publish]
    if: ${{ !cancelled() && (needs.gate.outputs.reproduce == 'true' || needs.publish.outputs.reproduce == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ai-workflows
          persist-credentials: false
      - id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - id: venv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.aiwf-venv
          key: aiwf-venv-v1-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('.ai-workflows/pyproject.toml') }}
      - if: steps.venv.outputs.cache-hit != 'true'
        run: python -m venv ~/.aiwf-venv && ~/.aiwf-venv/bin/pip install --quiet -e ./.ai-workflows
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: target
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          AIWF_CONFIG: ${{ inputs.config }}
        run: |
          ~/.aiwf-venv/bin/aiwf repro-context --repo "$REPO" --issue "$ISSUE" --out issue.md
          tar -czf target.tgz -C target .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repro-input
          path: |
            issue.md
            target.tgz
          retention-days: 7

  # B2 (reproducer): turns the report into a failing test by running project commands (ADR-0037). No GitHub token; the
  # only secret is the model token, kept from every command by the env scrub; every command runs in Claude Code's
  # sandbox (bubblewrap: writes only in work/ and the temp dir, egress only to `allowed_domains`, runner dirs unreadable),
  # with no fallback to unsandboxed commands. Tools: Bash and StructuredOutput only (Read, Edit, Write and WebFetch run
  # outside the sandbox); `--setting-sources user` ignores the target repo's .claude settings and hooks. No repo code runs
  # outside the agent in this job. The token check fails the job, without printing anything, if the token value appears
  # in the agent's answer or transcript; the answer is passed on only when that check succeeded.
  reproduce:
    needs: repro-context
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions: {}
    env:
      # Per-agent cost budget (ADR-0045); the e2e-only label `e2e-budget` makes it near zero (playground e2e config only).
      AGENT_BUDGET: ${{ fromJSON(inputs.config).e2e && contains(github.event.issue.labels.*.name, 'e2e-budget') && '0.0001' || fromJSON(inputs.config).limits.agent_budget_usd }}
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"  # ADR-0037: no credential in any Bash command's environment
    outputs:
      json: ${{ steps.token-check.outcome == 'success' && steps.claude.outputs.structured_output || '' }}
      usage: ${{ steps.usage.outputs.usage }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: repro-input
      - env:
          AIWF_REPO: ${{ job.workflow_repository }}
          AIWF_SHA: ${{ job.workflow_sha }}
          DOMAINS: ${{ toJSON(fromJSON(inputs.config).allowed_domains) }}
        run: |
          # Prompt and schema come from the commit this workflow file came from (ADR-0019), fetched without credentials.
          git init --quiet .ai-workflows
          git -C .ai-workflows fetch --quiet --depth 1 "https://github.com/$AIWF_REPO.git" "$AIWF_SHA"
          git -C .ai-workflows checkout --quiet FETCH_HEAD
          { cat .ai-workflows/prompts/reproducer.md; echo; cat issue.md; } > prompt.md
          mkdir work && tar -xzf target.tgz -C work && rm target.tgz
          # Sandbox settings (ADR-0037), merged by base-action into the user settings that --setting-sources user loads.
          deny='[]'
          for d in "$RUNNER_TEMP" "$HOME/.claude" /home/runner/runners /home/runner/actions-runner /opt/actions-runner; do
            if [ -e "$d" ]; then deny=$(jq -c --arg d "$d" '. + [$d]' <<< "$deny"); fi
          done
          jq -n --argjson domains "$DOMAINS" --argjson deny "$deny" '{sandbox: {enabled: true, failIfUnavailable: true,
            allowUnsandboxedCommands: false, autoAllowBashIfSandboxed: true, network: {allowedDomains: $domains},
            filesystem: {denyRead: $deny}}}' > settings.json
          # Claude's --json-schema rejects the draft 2020-12 `$schema` key; the orchestrator validates against the full file.
          echo "SCHEMA=$(jq -c 'del(."$schema")' .ai-workflows/schema/reproducer.json)" >> "$GITHUB_ENV"
      # The sandbox's requirements (ADR-0037); any failure fails the job: there is no unsandboxed fallback.
      - name: Sandbox setup
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          echo "AGENT_START=$(date +%s)" >> "$GITHUB_ENV"
      - id: claude
        timeout-minutes: ${{ fromJSON(inputs.config).limits.agent_minutes }}  # wall-clock budget (ADR-0045)
        uses: anthropics/claude-code-action/base-action@6d5ae526d25ce88daa2200be073e1a373167f064 # v1.0.265
        env:
          CLAUDE_WORKING_DIR: ${{ github.workspace }}/work
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt_file: ${{ github.workspace }}/prompt.md
          settings: ${{ github.workspace }}/settings.json
          claude_args: >-
            --max-turns 40
            --tools Bash,StructuredOutput
            --allowedTools Bash
            --setting-sources user
            --json-schema '${{ env.SCHEMA }}'
            --max-budget-usd ${{ env.AGENT_BUDGET }}
      # ADR-0037 verification: the token value must not appear in the answer or the transcript. Prints nothing about it.
      - name: Token check
        id: token-check
        if: ${{ !cancelled() && steps.claude.outcome != 'skipped' }}
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          ANSWER: ${{ steps.claude.outputs.structured_output }}
        run: |
          [ -n "$TOKEN" ] || { echo "::error::no token to check against"; exit 1; }
          found=0
          if [ -n "$EXEC_FILE" ] && [ -f "$EXEC_FILE" ] && grep -qF -- "$TOKEN" "$EXEC_FILE"; then found=1; fi
          if printf '%s' "$ANSWER" | grep -qF -- "$TOKEN"; then found=1; fi
          if [ "$found" = 1 ]; then echo "::error title=Token check::the model token appears in the agent's output"; exit 1; fi
          echo "token check passed"
      # This agent's usage, read by repro-publish for the budget check (ADR-0045).
      - id: usage
        if: always()
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          OUTCOME: ${{ steps.claude.outcome }}
          AGENT_MINUTES: ${{ fromJSON(inputs.config).limits.agent_minutes }}
        run: echo "usage=$(bash .ai-workflows/scripts/agent-usage.sh)" >> "$GITHUB_OUTPUT"

  # B2 labels and comment, from the checked JSON; invalid or missing output gives `ai: error` and nothing else.
  repro-publish:
    needs: [extract, classify, repro-context, reproduce]
    if: ${{ !cancelled() && needs.repro-context.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      budget: ${{ steps.publish.outputs.budget }}
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ai-workflows
          persist-credentials: false
      - id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - id: venv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.aiwf-venv
          key: aiwf-venv-v1-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('.ai-workflows/pyproject.toml') }}
      - if: steps.venv.outputs.cache-hit != 'true'
        run: python -m venv ~/.aiwf-venv && ~/.aiwf-venv/bin/pip install --quiet -e ./.ai-workflows
      - id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          AGENT_JSON: ${{ needs.reproduce.outputs.json }}
          AIWF_CONFIG: ${{ inputs.config }}
          AIWF_USAGE: ${{ format('{{"extract":{0},"classify":{1},"reproduce":{2}}}', needs.extract.outputs.usage || 'null', needs.classify.outputs.usage || 'null', needs.reproduce.outputs.usage || 'null') }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ~/.aiwf-venv/bin/aiwf publish --kind reproducer --repo "$REPO" --issue "$ISSUE" --run-url "$RUN_URL"

  # A failed job (ADR-0045): `ai: error` and one sticky error comment with the run link; never retried. Skipped when a
  # job was cancelled (`ai: off`), when nothing failed, and when publish reported a budget hit instead (an escalation,
  # not an error). The reason names the failed jobs only.
  failed:
    needs: [gate, context, extract, candidates, classify, publish, repro-context, reproduce, repro-publish]
    if: always() && contains(needs.*.result, 'failure') && needs.publish.outputs.budget != 'true' && needs.repro-publish.outputs.budget != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ai-workflows
          persist-credentials: false
      - id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - id: venv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.aiwf-venv
          key: aiwf-venv-v1-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('.ai-workflows/pyproject.toml') }}
      - if: steps.venv.outputs.cache-hit != 'true'
        run: python -m venv ~/.aiwf-venv && ~/.aiwf-venv/bin/pip install --quiet -e ./.ai-workflows
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ITEM: ${{ github.event.issue.number }}
          AIWF_NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ~/.aiwf-venv/bin/aiwf report-error --repo "$REPO" --issue "$ITEM" --run-url "$RUN_URL"
