# Reusable: Workflow B (issue triage and fixes). WP5: B1 classify on `issues.opened` and on a maintainer's `/retriage`;
# a new issue's result also goes to chat (WP11b1).
# WP6: B2 reproduce (ADR-0037), after B1 for a trusted author's bug, on a maintainer's `/reproduce`, or on the reporter's
# reply while the issue has `triage: needs-info`. The reproducer runs project commands: sandboxed Bash only, env scrubbed.
# WP8: B3 analyse after a reproducing B2 (no tools, code in its prompt), B4 analysis comment, `/fix` and `/no-fix`.
# WP9: B5 fix loop after a recorded `/fix`: up to 3 rounds of implementer (sandboxed as B2), the orchestrator's own check,
# adversarial reviewer, push to `ai-fix/issue-<n>` (the push job's `contents: write` only); escalation to a draft PR.
# B1 runs two agent passes (ADR-0035): pass 1 reads the issue and returns what to search for; the orchestrator gathers
# duplicate candidates (issue search, all issues) and possible fixes (commits and merged PRs since the reported
# version's tag) with a read-only token; pass 2 classifies. Issue and comment text are untrusted: they reach scripts
# through env vars or the API, and the agents as inline context in their prompts. Agent jobs hold no GitHub token
# scope, no file tools and no secret but the OAuth token (ADR-0039); only the publish job writes,
# after checking each agent's JSON against its schema.
name: ai-workflows triage
on:
  workflow_call:
    inputs:
      config:
        description: Normalised config JSON (output of config.yml)
        type: string
        required: true
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      SLACK_WEBHOOK_URL:
        required: false
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false

# One B1/B2 run per issue at a time (aiwf-kbc): runs that can start B1 or B2 (new issue, accepted `/retriage` or
# `/reproduce`, the reporter's reply as in repro-context) queue per issue and caller workflow; all other runs get their
# own group, so they never replace a pending run. A newer pending run replaces the older one: a replaced reply is read
# by it, a replaced command of another kind is lost (aiwf-1q2). Prefix differs from the caller's group (no deadlock).
concurrency:
  group: >-
    aiwf-triage-${{ github.workflow }}-${{ (github.event_name == 'issues'
      || contains(fromJSON('["retriage", "reproduce"]'), fromJSON(inputs.config).command)
      || (github.event_name == 'issue_comment' && !github.event.issue.pull_request
          && fromJSON(inputs.config).command == ''
          && github.event.comment.user.login == github.event.issue.user.login
          && contains(github.event.issue.labels.*.name, 'triage: needs-info')))
      && format('issue-{0}', github.event.issue.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: false

# Least privilege by default (ADR-0038); each job grants what it needs.
permissions: {}

jobs:
  # B1 pass-1 context with a read-only token: the issue under triage.
  # Which events run B1: a new issue, or `/retriage` from a maintainer (ADR-0005) on an issue (not a PR). config.yml
  # parses the comment once; any other comment skips the B1 jobs.
  context:
    if: github.event_name == 'issues' || (github.event_name == 'issue_comment' && !github.event.issue.pull_request && fromJSON(inputs.config).command == 'retriage')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    outputs:
      capped: ${{ steps.cap.outputs.capped }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ai-workflows
          persist-credentials: false
      - uses: ./.ai-workflows/.github/actions/aiwf-setup
      # Daily caps for outside authors (ADR-0058), before any agent: a capped issue skips extract and classify.
      # Maintainers and `/retriage` are never capped.
      - id: cap
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          AIWF_CONFIG: ${{ inputs.config }}
        run: aiwf triage-cap --repo "$REPO" --issue "$ISSUE"
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: aiwf triage-issue --repo "$REPO" --issue "$ISSUE" --out issue.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: triage-issue
          path: issue.md
          retention-days: 7

  # B1 pass 1 (extractor): reported version, search phrases, file paths. No tools but StructuredOutput; the issue is in
  # the prompt. The artifact comes from this run without a token (download-artifact has no token default).
  extract:
    needs: context
    if: needs.context.outputs.capped != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    outputs:
      json: ${{ steps.claude.outputs.structured_output }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: triage-issue
      # ai-workflows at job.workflow_sha, fetched without credentials (ADR-0040): prompts, schemas and the aiwf-agent
      # action come from the commit this workflow file came from. Defined once per file (YAML anchor), reused by every
      # agent job; it cannot be a composite action, since the action would have to be fetched first.
      - &fetch-aiwf
        name: Fetch ai-workflows
        env:
          AIWF_REPO: ${{ job.workflow_repository }}
          AIWF_SHA: ${{ job.workflow_sha }}
        run: |
          git init --quiet .ai-workflows
          git -C .ai-workflows fetch --quiet --depth 1 "https://github.com/$AIWF_REPO.git" "$AIWF_SHA"
          git -C .ai-workflows checkout --quiet FETCH_HEAD
      - run: |
          { cat .ai-workflows/prompts/extractor.md; echo; cat issue.md; } > prompt.md
      - id: claude
        timeout-minutes: 5  # time limit; a timeout fails the job: `ai: error` (ADR-0050)
        uses: ./.ai-workflows/.github/actions/aiwf-agent
        with:
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt-file: prompt.md
          schema: .ai-workflows/schema/extractor.json
          max-turns: 3
          model: ${{ fromJSON(inputs.config).model || '' }}

  # Candidates with a read-only token, after checking pass 1's JSON against its schema: duplicate candidates from issue
  # search over all issues, possible fixes from commits and merged PRs since the reported version's tag (ADR-0035).
  candidates:
    needs: extract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      range_confidence: ${{ steps.gather.outputs.range_confidence }}
      candidates: ${{ steps.gather.outputs.candidates }}  # what the classifier is shown; publish accepts only these
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ai-workflows
          persist-credentials: false
      - uses: ./.ai-workflows/.github/actions/aiwf-setup
      - id: gather
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          AIWF_CONFIG: ${{ inputs.config }}
          EXTRACT_JSON: ${{ needs.extract.outputs.json }}
        run: aiwf triage-candidates --repo "$REPO" --issue "$ISSUE" --out context.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: triage-context
          path: context.md
          retention-days: 7

  # B1 pass 2 (classifier): class, duplicate, possible fix. No tools but StructuredOutput; issue and candidates inline.
  classify:
    needs: [context, candidates]
    if: needs.context.outputs.capped != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    outputs:
      json: ${{ steps.claude.outputs.structured_output }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: triage-context
      - *fetch-aiwf
      - run: |
          { cat .ai-workflows/prompts/classifier.md; echo; cat context.md; } > prompt.md
      - id: claude
        timeout-minutes: 10  # time limit; a timeout fails the job: `ai: error` (ADR-0050)
        uses: ./.ai-workflows/.github/actions/aiwf-agent
        with:
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt-file: prompt.md
          schema: .ai-workflows/schema/classifier.json
          max-turns: 3
          model: ${{ fromJSON(inputs.config).model || '' }}

  # Labels and the one triage comment, from the checked JSON; invalid output gives `ai: error` and nothing else.
  # A capped issue (ADR-0058) gets `triage: needs-human` and a fixed comment instead, with no agent output.
  publish:
    needs: [context, extract, candidates, classify]
    if: always() && needs.context.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read  # check a fixing commit is on the default branch
      issues: write
      pull-requests: read  # check a fixing PR was merged into the default branch
    outputs:
      alert_text: ${{ steps.publish.outputs.alert_text }}
      alert_url: ${{ steps.publish.outputs.alert_url }}
      reproduce: ${{ steps.publish.outputs.reproduce }}  # a trusted author's bug goes on to B2 (ADR-0037)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ai-workflows
          persist-credentials: false
      - uses: ./.ai-workflows/.github/actions/aiwf-setup
      - if: needs.context.outputs.capped == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: aiwf triage-capped --repo "$REPO" --issue "$ISSUE"
      - id: publish
        if: needs.context.outputs.capped != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          AGENT_JSON: ${{ needs.classify.outputs.json }}
          EXTRACT_JSON: ${{ needs.extract.outputs.json }}  # its suspicious_instructions are reported too
          AIWF_CONFIG: ${{ inputs.config }}
          AIWF_FIX_RANGE_CONFIDENCE: ${{ needs.candidates.outputs.range_confidence }}
          AIWF_TRIAGE_CANDIDATES: ${{ needs.candidates.outputs.candidates }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: aiwf publish --kind classifier --repo "$REPO" --issue "$ISSUE" --run-url "$RUN_URL"

  # "New issue triaged" chat alert (spec: Chat notifications, WP11b1) to the config's `notify` channels: new issues only,
  # never on `/retriage`. Only a published classifier result sets the alert (a capped issue has none, ADR-0058); its
  # text holds checked fields only. The only job given the chat secrets, through env vars to the send step; no GitHub
  # token scope. aiwf notify never prints the secrets, the request URLs or the chat ID.
  notify:
    needs: publish
    if: github.event_name == 'issues' && github.event.action == 'opened' && needs.publish.outputs.alert_text != '' && fromJSON(inputs.config).notify != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ai-workflows
          persist-credentials: false
      - uses: ./.ai-workflows/.github/actions/aiwf-setup
      - env:
          CHANNELS: ${{ fromJSON(inputs.config).notify }}
          NOTIFY_TEXT: ${{ needs.publish.outputs.alert_text }}
          NOTIFY_URL: ${{ needs.publish.outputs.alert_url }}
          AIWF_SHA: ${{ job.workflow_sha }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: aiwf notify --channels "$CHANNELS"

  # B2 context with a read-only token: the issue and the comments that matter, the project's commands, and the default
  # branch's code (persist-credentials false: no token is left in the tarball's .git). Pattern: docs/patterns.md.
  # Which events run B2 (ADR-0037), each its own clause: B1 publish handed on a trusted author's bug; `/reproduce` from a
  # maintainer (config.yml parsed the comment, ADR-0005); or the reporter's reply, a comment that is no command, by the
  # issue's author, while the issue has `triage: needs-info`, which only B2 sets, so only after a trusted start.
  repro-context:
    needs: publish
    if: >-
      ${{ !cancelled() && (
        needs.publish.outputs.reproduce == 'true'
        || (github.event_name == 'issue_comment' && !github.event.issue.pull_request
            && fromJSON(inputs.config).command == 'reproduce')
        || (github.event_name == 'issue_comment' && !github.event.issue.pull_request
            && fromJSON(inputs.config).command == ''
            && github.event.comment.user.login == github.event.issue.user.login
            && contains(github.event.issue.labels.*.name, 'triage: needs-info'))
      ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    outputs:
      sha: ${{ steps.tree.outputs.sha }}  # the commit B2 runs on and B3 analyses (its links point there)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ai-workflows
          persist-credentials: false
      - uses: ./.ai-workflows/.github/actions/aiwf-setup
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: target
          persist-credentials: false
      - id: tree
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          AIWF_CONFIG: ${{ inputs.config }}
        run: |
          aiwf repro-context --repo "$REPO" --issue "$ISSUE" --out issue.md
          echo "sha=$(git -C target rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          tar -czf target.tgz -C target .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repro-input
          path: |
            issue.md
            target.tgz
          retention-days: 7

  # B2 (reproducer): turns the report into a failing test by running project commands (ADR-0037). No GitHub token; the
  # only secret is the model token, kept from every command by the env scrub; every command runs in Claude Code's
  # sandbox (bubblewrap: writes only in work/ and the temp dir, egress only to `allowed_domains`, runner dirs unreadable),
  # with no fallback to unsandboxed commands. Tools: Bash and StructuredOutput only (Read, Edit, Write and WebFetch run
  # outside the sandbox); `--setting-sources user` ignores the target repo's .claude settings and hooks, and
  # `--strict-mcp-config` its .mcp.json; those flags are the guarantee (repo code could recreate the files). Deleting
  # them from work/ first is belt and braces; a later agent that diffs work/ must diff against target/. No repo code runs
  # outside the agent in this job. The token check fails the job, without printing anything, if the token value appears
  # in the agent's answer or transcript; the answer is passed on only when that check succeeded. The `if` is required:
  # without a status check GitHub skips the job when any earlier job was skipped, e.g. `publish` on a `/reproduce`.
  reproduce:
    needs: repro-context
    if: ${{ !cancelled() && needs.repro-context.result == 'success' }}
    runs-on: ubuntu-24.04  # the sandbox cannot start on ubuntu-26.04; unpin with bead aiwf-5t2
    timeout-minutes: 25
    permissions: {}
    env:
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"  # ADR-0037: no credential in any Bash command's environment
      CLAUDE_WORKING_DIR: ${{ github.workspace }}/work  # base-action runs Claude Code in the unpacked target code
    outputs:
      json: ${{ steps.token-check.outcome == 'success' && steps.claude.outputs.structured_output || '' }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: repro-input
      - *fetch-aiwf
      - env:
          DOMAINS: ${{ toJSON(fromJSON(inputs.config).allowed_domains) }}
        run: |
          { cat .ai-workflows/prompts/reproducer.md; echo; cat issue.md; } > prompt.md
          mkdir work && tar -xzf target.tgz -C work && rm target.tgz
          rm -rf work/.mcp.json work/.claude  # the repo's MCP servers, settings and hooks never load (aiwf-zzn)
          # Sandbox settings (ADR-0037), merged by base-action into the user settings that --setting-sources user loads.
          deny='[]'
          for d in "$RUNNER_TEMP" "$HOME/.claude" /home/runner/runners /home/runner/actions-runner /opt/actions-runner; do
            if [ -e "$d" ]; then deny=$(jq -c --arg d "$d" '. + [$d]' <<< "$deny"); fi
          done
          jq -n --argjson domains "$DOMAINS" --argjson deny "$deny" '{sandbox: {enabled: true, failIfUnavailable: true,
            allowUnsandboxedCommands: false, autoAllowBashIfSandboxed: true, network: {allowedDomains: $domains},
            filesystem: {denyRead: $deny}}}' > settings.json
      # The sandbox's requirements (ADR-0037); any failure fails the job: there is no unsandboxed fallback.
      - name: Sandbox setup
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # sandbox-settings gives the agent Bash (sandboxed, auto-allowed) and --setting-sources user (CP8 shared action).
      - id: claude
        timeout-minutes: 20  # time limit; a timeout fails the job: `ai: error` (ADR-0050)
        uses: ./.ai-workflows/.github/actions/aiwf-agent
        with:
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt-file: ${{ github.workspace }}/prompt.md
          schema: ${{ github.workspace }}/.ai-workflows/schema/reproducer.json
          max-turns: 40
          model: ${{ fromJSON(inputs.config).model || '' }}
          sandbox-settings: ${{ github.workspace }}/settings.json
      # ADR-0037 verification: the token value must not appear in the answer or the transcript. Prints nothing about it.
      - name: Token check
        id: token-check
        if: ${{ !cancelled() && steps.claude.outcome != 'skipped' }}
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          ANSWER: ${{ steps.claude.outputs.structured_output }}
        run: |
          [ -n "$TOKEN" ] || { echo "::error::no token to check against"; exit 1; }
          found=0
          if [ -n "$EXEC_FILE" ] && [ -f "$EXEC_FILE" ] && grep -qF -- "$TOKEN" "$EXEC_FILE"; then found=1; fi
          if printf '%s' "$ANSWER" | grep -qF -- "$TOKEN"; then found=1; fi
          if [ "$found" = 1 ]; then echo "::error title=Token check::the model token appears in the agent's output"; exit 1; fi
          echo "token check passed"

  # B2 labels and comment, from the checked JSON; invalid or missing output gives `ai: error` and nothing else.
  repro-publish:
    needs: [repro-context, reproduce]
    if: ${{ !cancelled() && needs.repro-context.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    outputs:
      reproduced: ${{ steps.publish.outputs.reproduced }}  # 'true': B3 runs next
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ai-workflows
          persist-credentials: false
      - uses: ./.ai-workflows/.github/actions/aiwf-setup
      - id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          AGENT_JSON: ${{ needs.reproduce.outputs.json }}
          AIWF_CONFIG: ${{ inputs.config }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: aiwf publish --kind reproducer --repo "$REPO" --issue "$ISSUE" --run-url "$RUN_URL"

  # B3 context (spec B3): no agent and no token scope. It checks B2's answer against its schema, unpacks the tree B2 ran
  # on (same-run artifact, no token) and puts into the prompt the source files the test imports or its output names,
  # and their callers, capped as for A (ADR-0034). Those paths come from B2's untrusted answer: a path is read only
  # when it is relative, every component is no symlink, its real path stays in the tree and it is a regular file. The
  # list of tree files passing that check goes along, so the publish job links only those without opening the tree.
  analyse-context:
    needs: [repro-context, reproduce, repro-publish]
    if: ${{ !cancelled() && needs.repro-publish.result == 'success' && needs.repro-publish.outputs.reproduced == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: repro-input
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ai-workflows
          persist-credentials: false
      - uses: ./.ai-workflows/.github/actions/aiwf-setup
      - env:
          REPRO_JSON: ${{ needs.reproduce.outputs.json }}
          SHA: ${{ needs.repro-context.outputs.sha }}
        run: |
          mkdir tree && tar -xzf target.tgz -C tree && rm target.tgz
          aiwf analyse-context --tree tree --sha "$SHA" --out analysis.md --files-out files.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: analyse-input
          path: |
            analysis.md
            files.json
          retention-days: 7

  # B3 (analyst): root cause, blast radius, fix plan, confidence and size. No tools but StructuredOutput, no command
  # runs (ADR-0039), so ADR-0037's exception does not extend to it; the code is in its prompt.
  analyse:
    needs: analyse-context
    if: ${{ !cancelled() && needs.analyse-context.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    outputs:
      json: ${{ steps.claude.outputs.structured_output }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: analyse-input
      - *fetch-aiwf
      - run: |
          { cat .ai-workflows/prompts/analyst.md; echo; cat analysis.md; } > prompt.md
      - id: claude
        timeout-minutes: 10  # time limit; a timeout fails the job: `ai: error` (ADR-0050)
        uses: ./.ai-workflows/.github/actions/aiwf-agent
        with:
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt-file: prompt.md
          schema: .ai-workflows/schema/analyst.json
          max-turns: 3
          model: ${{ fromJSON(inputs.config).model || '' }}

  # B4: the analysis comment (by marker, updated in place) and `triage: awaiting-maintainer`, from the checked JSON.
  # Risk tier and file links are built here (spec B3); links only for paths in files.json, at the analysed commit.
  analyse-publish:
    needs: [repro-context, analyse-context, analyse]
    if: ${{ !cancelled() && needs.analyse.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: analyse-input
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ai-workflows
          persist-credentials: false
      - uses: ./.ai-workflows/.github/actions/aiwf-setup
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          AGENT_JSON: ${{ needs.analyse.outputs.json }}
          AIWF_CONFIG: ${{ inputs.config }}
          AIWF_ANALYSIS_SHA: ${{ needs.repro-context.outputs.sha }}
          AIWF_ANALYSIS_FILES: files.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: aiwf publish --kind analyst --repo "$REPO" --issue "$ISSUE" --run-url "$RUN_URL"

  # B4 commands (spec B4): `/fix [guidance]` or `/no-fix <reason>` from a maintainer (config.yml checked the author,
  # ADR-0005). Acts only while the issue has `triage: awaiting-maintainer`, read live; records the decision in the
  # analysis comment's status line. A recorded `/fix` outputs `fix=true`: B5 starts in this run.
  decide:
    if: github.event_name == 'issue_comment' && !github.event.issue.pull_request && (fromJSON(inputs.config).command == 'fix' || fromJSON(inputs.config).command == 'no-fix')
    concurrency:  # one decision at a time per issue: the label check and its removal are not atomic
      group: aiwf-decide-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    outputs:
      fix: ${{ steps.decide.outputs.fix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ai-workflows
          persist-credentials: false
      - uses: ./.ai-workflows/.github/actions/aiwf-setup
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          AIWF_CONFIG: ${{ inputs.config }}
        run: aiwf decide --repo "$REPO" --issue "$ISSUE"

  # B5 context (spec B5): starts only when the bot's analysis comment's status line is this run's `/fix` approval and
  # `ai-fix/issue-<n>` does not exist (else one comment saying so, and no round). The brief (project commands, guidance
  # from that status line only, the issue and relevant comments, B2's and B3's bot comments found by author and marker)
  # and the default branch's code (no token in the tarball's .git) go to every round as a same-run artifact.
  fix-context:
    needs: decide
    if: needs.decide.outputs.fix == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write  # the "branch exists" comment only
    outputs:
      start: ${{ steps.context.outputs.start }}
      sha: ${{ steps.context.outputs.sha }}  # the base commit every round's diff applies to
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ai-workflows
          persist-credentials: false
      - uses: ./.ai-workflows/.github/actions/aiwf-setup
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: target
          persist-credentials: false
      - id: context
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          AIWF_CONFIG: ${{ inputs.config }}
        run: |
          mkdir -p fix
          aiwf fix-context --repo "$REPO" --issue "$ISSUE" --out fix
          echo "sha=$(git -C target rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          tar -czf fix/target.tgz -C target .
      - if: steps.context.outputs.start == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fix-input
          path: |
            fix/brief.md
            fix/meta.json
            fix/target.tgz
          retention-days: 7

  # B5 rounds (spec B5), up to `limits.fix_rounds` (1 to 3); round k+1 runs only when round k's push job says so
  # (rejected, loop not stopped, k < fix_rounds). Each round is four jobs, their steps shared through YAML anchors:
  # - implement: the implementer (ADR-0037, as the reproducer: sandboxed Bash only, env scrubbed, repo .mcp.json and
  #   .claude removed and ignored, token check) edits the base tree plus the previous round's diff; the job turns the
  #   tree into the round's cumulative diff (against a pristine copy of the base, so nothing the agent does to .git
  #   counts), which the token check also scans. It holds the model token and no GitHub token scope.
  # - check: the orchestrator's exit condition, with no secret and no token scope. It applies the diff and runs the
  #   config's `setup`, `test` and the reproduction test's command as an unprivileged user (output to a file, never to
  #   the job log, so it cannot set outputs or issue workflow commands). A failure fails the job (continue-on-error: the
  #   run goes on) and rejects the round; `ok` alone decides.
  # - review: the adversarial reviewer, no tools, fresh context: brief and diff inline, never the implementer's answer.
  #   Runs only after a passing check.
  # - push (`contents: write`): `aiwf fix-push` checks both answers against their schemas and pushes the cumulative diff
  #   to `ai-fix/issue-<n>` through the Git data API, rejected rounds too, unless it touches `.github/`, the status line
  #   changed or the branch head is not the commit pushed last.
  round-1-implement:
    name: round-1 / implement
    needs: fix-context
    if: ${{ !cancelled() && needs.fix-context.outputs.start == 'true' }}
    runs-on: ubuntu-24.04  # the sandbox cannot start on ubuntu-26.04; unpin with bead aiwf-5t2
    timeout-minutes: 45
    permissions: {}
    env:
      ROUND: "1"
      PREV: "0"
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"  # ADR-0037: no credential in any Bash command's environment
      CLAUDE_WORKING_DIR: ${{ github.workspace }}/work
    outputs: &implement-outputs
      json: ${{ steps.token-check.outcome == 'success' && steps.claude.outputs.structured_output || '' }}
    steps: &implement-steps
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fix-input
          path: fix
      - if: env.PREV != '0'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fix-diff-${{ env.PREV }}
          path: prev
      - if: env.PREV != '0'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fix-round-${{ env.PREV }}
          path: prev
      - *fetch-aiwf
      - env:
          DOMAINS: ${{ toJSON(fromJSON(inputs.config).allowed_domains) }}
        run: |
          { cat .ai-workflows/prompts/implementer.md; echo; cat fix/brief.md
            if [ -f prev/findings.md ]; then echo; cat prev/findings.md; fi; } > prompt.md
          mkdir work && tar -xzf fix/target.tgz -C work
          if [ -s prev/patch.diff ]; then git -C work apply --binary "$GITHUB_WORKSPACE/prev/patch.diff"; fi
          rm -rf work/.mcp.json work/.claude  # the repo's MCP servers, settings and hooks never load (aiwf-zzn)
          deny='[]'
          for d in "$RUNNER_TEMP" "$HOME/.claude" /home/runner/runners /home/runner/actions-runner /opt/actions-runner; do
            if [ -e "$d" ]; then deny=$(jq -c --arg d "$d" '. + [$d]' <<< "$deny"); fi
          done
          jq -n --argjson domains "$DOMAINS" --argjson deny "$deny" '{sandbox: {enabled: true, failIfUnavailable: true,
            allowUnsandboxedCommands: false, autoAllowBashIfSandboxed: true, network: {allowedDomains: $domains},
            filesystem: {denyRead: $deny}}}' > settings.json
      - name: Sandbox setup
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - id: claude
        timeout-minutes: 30  # time limit; a timeout fails the job: `ai: error` (ADR-0050)
        uses: ./.ai-workflows/.github/actions/aiwf-agent
        with:
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt-file: ${{ github.workspace }}/prompt.md
          schema: ${{ github.workspace }}/.ai-workflows/schema/implementer.json
          max-turns: 60
          model: ${{ fromJSON(inputs.config).model || '' }}
          sandbox-settings: ${{ github.workspace }}/settings.json
      # The cumulative diff against a pristine base (the .git from the tarball, not the agent's), without the repo's
      # .mcp.json and .claude (removed above, never part of a fix).
      - name: Diff
        if: steps.claude.outcome == 'success'
        run: |
          set -euo pipefail
          mkdir pristine && tar -xzf fix/target.tgz -C pristine
          cd work
          git --git-dir=../pristine/.git --work-tree=. add -A -- . ':(exclude).mcp.json' ':(exclude).claude'
          git --git-dir=../pristine/.git --work-tree=. diff --cached --binary HEAD > ../patch.diff
          echo "diff: $(wc -c < ../patch.diff) bytes"
      - name: Token check
        id: token-check
        if: ${{ !cancelled() && steps.claude.outcome != 'skipped' }}
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          ANSWER: ${{ steps.claude.outputs.structured_output }}
        run: |
          [ -n "$TOKEN" ] || { echo "::error::no token to check against"; exit 1; }
          found=0
          if [ -n "$EXEC_FILE" ] && [ -f "$EXEC_FILE" ] && grep -qF -- "$TOKEN" "$EXEC_FILE"; then found=1; fi
          if printf '%s' "$ANSWER" | grep -qF -- "$TOKEN"; then found=1; fi
          if [ -f patch.diff ] && grep -qF -- "$TOKEN" patch.diff; then found=1; fi
          if [ "$found" = 1 ]; then echo "::error title=Token check::the model token appears in the agent's output"; exit 1; fi
          echo "token check passed"
      - if: steps.token-check.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fix-diff-${{ env.ROUND }}
          path: patch.diff
          if-no-files-found: error
          retention-days: 7

  round-1-check:
    name: round-1 / check
    needs: [fix-context, round-1-implement]
    if: ${{ !cancelled() && needs.round-1-implement.result == 'success' }}
    runs-on: ubuntu-24.04  # same image as the implementer, so both run the commands alike
    timeout-minutes: 45
    continue-on-error: true  # a failed check rejects the round; the run goes on
    permissions: {}
    env:
      ROUND: "1"
    outputs: &check-outputs
      ok: ${{ steps.check.outputs.ok }}
    steps: &check-steps
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fix-input
          path: fix
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fix-diff-${{ env.ROUND }}
          path: diff
      - id: check
        timeout-minutes: 40
        env:
          SETUP: ${{ fromJSON(inputs.config).setup || '' }}
          TEST: ${{ fromJSON(inputs.config).test || '' }}
        run: |
          set -uo pipefail
          ok=true
          : > check.log
          repro=$(jq -r '.repro_command // ""' fix/meta.json)
          home=/home/aiwfcheck
          mkdir work && tar -xzf fix/target.tgz -C work
          if [ ! -s diff/patch.diff ]; then echo "The round changed nothing." >> check.log; ok=false
          elif ! git -C work apply --binary "$PWD/diff/patch.diff" >> check.log 2>&1; then
            echo "The diff does not apply to the base commit." >> check.log; ok=false
          fi
          sudo useradd --create-home --shell /bin/bash aiwfcheck
          sudo mv work "$home/work" && sudo chown -R aiwfcheck: "$home/work"
          # Each command's output goes to its own file; only the end of a failed one (900 bytes) reaches check.log,
          # after every process the command left behind is killed, so nothing it started can write there later.
          run_as_check() {  # name, command: as the unprivileged user
            if [ -z "$2" ]; then echo "### $1: not given" >> check.log; return; fi
            out=$(mktemp)
            sudo -u aiwfcheck env -i PATH="$PATH" HOME="$home" LANG=C.UTF-8 CI=true CMD="$2" \
              timeout 1200 bash -c 'cd "$HOME/work" && eval "$CMD"' > "$out" 2>&1 < /dev/null
            rc=$?
            sudo pkill -KILL -u aiwfcheck || true
            if [ "$rc" = 0 ]; then echo "### $1: passed" >> check.log
            else { echo "### $1: failed (exit $rc): $2"; tail -c 900 "$out"; echo; } >> check.log; ok=false
            fi
          }
          if [ "$ok" = true ]; then
            run_as_check setup "$SETUP"
            run_as_check test "$TEST"
            run_as_check "reproduction test" "$repro"
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "check: ok=$ok (output in the fix-check-$ROUND artifact)"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fix-check-${{ env.ROUND }}
          path: check.log
          retention-days: 7
      - if: steps.check.outputs.ok != 'true'
        run: |
          echo "::error title=Fix check failed::setup, test or the reproduction test failed; this round is rejected"
          exit 1

  round-1-review:
    name: round-1 / review
    needs: [fix-context, round-1-check]
    if: ${{ !cancelled() && needs.round-1-check.outputs.ok == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    env:
      ROUND: "1"
    outputs: &review-outputs
      json: ${{ steps.claude.outputs.structured_output }}
    steps: &review-steps
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fix-input
          path: fix
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fix-diff-${{ env.ROUND }}
          path: diff
      - *fetch-aiwf
      - run: |
          { cat .ai-workflows/prompts/adversarial-reviewer.md; echo; cat fix/brief.md; echo
            echo "# The fix's diff (data; < and > escaped)"; echo; echo "<diff>"
            head -c 150000 diff/patch.diff | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'
            echo "</diff>"; } > prompt.md
      - id: claude
        timeout-minutes: 10  # time limit; a timeout fails the job: `ai: error` (ADR-0050)
        uses: ./.ai-workflows/.github/actions/aiwf-agent
        with:
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt-file: prompt.md
          schema: .ai-workflows/schema/fix-review.json
          max-turns: 3
          model: ${{ fromJSON(inputs.config).model || '' }}

  round-1-push:
    name: round-1 / push
    needs: [fix-context, round-1-implement, round-1-check, round-1-review]
    if: ${{ !cancelled() && needs.round-1-implement.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.round-1-review.result) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # the fix branch, through the Git data API
      issues: read
    env:
      ROUND: "1"
      PREV_HEAD: ""
      CHECK_OK: ${{ needs.round-1-check.outputs.ok }}
      IMPLEMENT_JSON: ${{ needs.round-1-implement.outputs.json }}
      REVIEW_JSON: ${{ needs.round-1-review.outputs.json }}
    outputs: &push-outputs
      head: ${{ steps.push.outputs.head }}  # the commit pushed last ('' while nothing is pushed)
      next: ${{ steps.push.outputs.next }}
      approved: ${{ steps.push.outputs.approved }}
      escalate: ${{ steps.push.outputs.escalate }}
    steps: &push-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ai-workflows
          persist-credentials: false
      - uses: ./.ai-workflows/.github/actions/aiwf-setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fix-input
          path: fix
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fix-diff-${{ env.ROUND }}
          path: diff
      - continue-on-error: true  # no log when the check job did not get that far: a failed check
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fix-check-${{ env.ROUND }}
          path: check
      - id: push
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          AIWF_CONFIG: ${{ inputs.config }}
          BASE_SHA: ${{ needs.fix-context.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir tree && tar -xzf fix/target.tgz -C tree
          aiwf fix-push --repo "$REPO" --issue "$ISSUE" --round "$ROUND" --meta fix/meta.json --tree tree \
            --patch diff/patch.diff --check-log check/check.log --out round
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fix-round-${{ env.ROUND }}
          path: |
            round/round.json
            round/findings.md
          retention-days: 7

  round-2-implement:
    name: round-2 / implement
    needs: round-1-push
    if: ${{ !cancelled() && needs.round-1-push.outputs.next == 'true' }}
    runs-on: ubuntu-24.04  # the sandbox cannot start on ubuntu-26.04; unpin with bead aiwf-5t2
    timeout-minutes: 45
    permissions: {}
    env:
      ROUND: "2"
      PREV: "1"
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"  # ADR-0037: no credential in any Bash command's environment
      CLAUDE_WORKING_DIR: ${{ github.workspace }}/work
    outputs: *implement-outputs  # anchored in round-1-implement
    steps: *implement-steps

  round-2-check:
    name: round-2 / check
    needs: [fix-context, round-2-implement]
    if: ${{ !cancelled() && needs.round-2-implement.result == 'success' }}
    runs-on: ubuntu-24.04  # same image as the implementer, so both run the commands alike
    timeout-minutes: 45
    continue-on-error: true
    permissions: {}
    env:
      ROUND: "2"
    outputs: *check-outputs  # anchored in round-1-check
    steps: *check-steps

  round-2-review:
    name: round-2 / review
    needs: [fix-context, round-2-check]
    if: ${{ !cancelled() && needs.round-2-check.outputs.ok == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    env:
      ROUND: "2"
    outputs: *review-outputs  # anchored in round-1-review
    steps: *review-steps

  round-2-push:
    name: round-2 / push
    needs: [fix-context, round-1-push, round-2-implement, round-2-check, round-2-review]
    if: ${{ !cancelled() && needs.round-2-implement.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.round-2-review.result) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # the fix branch, through the Git data API
      issues: read
    env:
      ROUND: "2"
      PREV_HEAD: ${{ needs.round-1-push.outputs.head }}
      CHECK_OK: ${{ needs.round-2-check.outputs.ok }}
      IMPLEMENT_JSON: ${{ needs.round-2-implement.outputs.json }}
      REVIEW_JSON: ${{ needs.round-2-review.outputs.json }}
    outputs: *push-outputs  # anchored in round-1-push
    steps: *push-steps

  round-3-implement:
    name: round-3 / implement
    needs: round-2-push
    if: ${{ !cancelled() && needs.round-2-push.outputs.next == 'true' }}
    runs-on: ubuntu-24.04  # the sandbox cannot start on ubuntu-26.04; unpin with bead aiwf-5t2
    timeout-minutes: 45
    permissions: {}
    env:
      ROUND: "3"
      PREV: "2"
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"  # ADR-0037: no credential in any Bash command's environment
      CLAUDE_WORKING_DIR: ${{ github.workspace }}/work
    outputs: *implement-outputs  # anchored in round-1-implement
    steps: *implement-steps

  round-3-check:
    name: round-3 / check
    needs: [fix-context, round-3-implement]
    if: ${{ !cancelled() && needs.round-3-implement.result == 'success' }}
    runs-on: ubuntu-24.04  # same image as the implementer, so both run the commands alike
    timeout-minutes: 45
    continue-on-error: true
    permissions: {}
    env:
      ROUND: "3"
    outputs: *check-outputs  # anchored in round-1-check
    steps: *check-steps

  round-3-review:
    name: round-3 / review
    needs: [fix-context, round-3-check]
    if: ${{ !cancelled() && needs.round-3-check.outputs.ok == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    env:
      ROUND: "3"
    outputs: *review-outputs  # anchored in round-1-review
    steps: *review-steps

  round-3-push:
    name: round-3 / push
    needs: [fix-context, round-2-push, round-3-implement, round-3-check, round-3-review]
    if: ${{ !cancelled() && needs.round-3-implement.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.round-3-review.result) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # the fix branch, through the Git data API
      issues: read
    env:
      ROUND: "3"
      PREV_HEAD: ${{ needs.round-2-push.outputs.head }}
      CHECK_OK: ${{ needs.round-3-check.outputs.ok }}
      IMPLEMENT_JSON: ${{ needs.round-3-implement.outputs.json }}
      REVIEW_JSON: ${{ needs.round-3-review.outputs.json }}
    outputs: *push-outputs  # anchored in round-1-push
    steps: *push-steps

  # B5 escalation (spec B5): the loop ended without an approved round (cap reached, or stopped by a guard). Draft PR of
  # the last pushed work (none when nothing was pushed; a refused PR is reported in the comment and the log only), one
  # comment that mentions each maintainer with every round's findings, `fix: needs-maintainer`, the maintainers
  # assigned to the issue and the PR and requested as reviewers. An exit, not an `ai: error`.
  escalate:
    needs: [fix-context, round-1-push, round-2-push, round-3-push]
    if: ${{ !cancelled() && (needs.round-1-push.outputs.escalate == 'true' || needs.round-2-push.outputs.escalate == 'true' || needs.round-3-push.outputs.escalate == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write  # the draft PR, its assignees and review request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ai-workflows
          persist-credentials: false
      - uses: ./.ai-workflows/.github/actions/aiwf-setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fix-round-*
          path: records
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          AIWF_CONFIG: ${{ inputs.config }}
          FIX_HEAD: ${{ needs.round-3-push.outputs.head || needs.round-2-push.outputs.head || needs.round-1-push.outputs.head }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: aiwf fix-escalate --repo "$REPO" --issue "$ISSUE" --records records

  # A failed job (ADR-0045): `ai: error` and one sticky error comment with the run link; never retried. Skipped when a
  # job was cancelled (`ai: off`) and when nothing failed. An agent that hits its time limit fails its job (ADR-0050).
  # The reason names the failed jobs only. A failed chat alert (`notify`) is not an `ai: error`: triage itself worked,
  # and the failed notify job shows in the run (aiwf-3ci). A round's check job is left out too: its failure rejects the
  # round (spec B5).
  failed:
    needs: [context, extract, candidates, classify, publish, repro-context, reproduce, repro-publish, analyse-context,
            analyse, analyse-publish, decide, fix-context, round-1-implement, round-1-review, round-1-push,
            round-2-implement, round-2-review, round-2-push, round-3-implement, round-3-review, round-3-push, escalate]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ai-workflows
          persist-credentials: false
      - uses: ./.ai-workflows/.github/actions/aiwf-setup
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ITEM: ${{ github.event.issue.number }}
          AIWF_NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: aiwf report-error --repo "$REPO" --issue "$ITEM" --run-url "$RUN_URL"
