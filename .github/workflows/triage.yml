# Reusable: Workflow B (issue triage and fixes). WP5: B1 classify on `issues.opened` and on a maintainer's `/retriage`;
# a new issue's result also goes to chat (WP11b1).
# WP6: B2 reproduce (ADR-0037), after B1 for a trusted author's bug, on a maintainer's `/reproduce`, or on the reporter's
# reply while the issue has `triage: needs-info`. The reproducer runs project commands: sandboxed Bash only, env scrubbed.
# B1 runs two agent passes (ADR-0035): pass 1 reads the issue and returns what to search for; the orchestrator gathers
# duplicate candidates (issue search, all issues) and possible fixes (commits and merged PRs since the reported
# version's tag) with a read-only token; pass 2 classifies. Issue and comment text are untrusted: they reach scripts
# through env vars or the API, and the agents as inline context in their prompts. Agent jobs hold no GitHub token
# scope, no file tools and no secret but the OAuth token (ADR-0039); only the publish job writes,
# after checking each agent's JSON against its schema.
name: ai-workflows triage
on:
  workflow_call:
    inputs:
      config:
        description: Normalised config JSON (output of config.yml)
        type: string
        required: true
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      SLACK_WEBHOOK_URL:
        required: false
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false

# Least privilege by default (ADR-0038); each job grants what it needs.
permissions: {}

jobs:
  # B1 pass-1 context with a read-only token: the issue under triage.
  # Which events run B1: a new issue, or `/retriage` from a maintainer (ADR-0005) on an issue (not a PR). config.yml
  # parses the comment once; any other comment skips the B1 jobs.
  context:
    if: github.event_name == 'issues' || (github.event_name == 'issue_comment' && !github.event.issue.pull_request && fromJSON(inputs.config).command == 'retriage')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    outputs:
      capped: ${{ steps.cap.outputs.capped }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ai-workflows
          persist-credentials: false
      - uses: ./.ai-workflows/.github/actions/aiwf-setup
      # Daily caps for outside authors (ADR-0058), before any agent: a capped issue skips extract and classify.
      # Maintainers and `/retriage` are never capped.
      - id: cap
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          AIWF_CONFIG: ${{ inputs.config }}
        run: ~/.aiwf-venv/bin/aiwf triage-cap --repo "$REPO" --issue "$ISSUE"
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: ~/.aiwf-venv/bin/aiwf triage-issue --repo "$REPO" --issue "$ISSUE" --out issue.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: triage-issue
          path: issue.md
          retention-days: 7

  # B1 pass 1 (extractor): reported version, search phrases, file paths. No tools but StructuredOutput; the issue is in
  # the prompt. The artifact comes from this run without a token (download-artifact has no token default).
  extract:
    needs: context
    if: needs.context.outputs.capped != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    outputs:
      json: ${{ steps.claude.outputs.structured_output }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: triage-issue
      - env:
          AIWF_REPO: ${{ job.workflow_repository }}
          AIWF_SHA: ${{ job.workflow_sha }}
        run: |
          # Prompt and schema come from the commit this workflow file came from (ADR-0040), fetched without credentials.
          git init --quiet .ai-workflows
          git -C .ai-workflows fetch --quiet --depth 1 "https://github.com/$AIWF_REPO.git" "$AIWF_SHA"
          git -C .ai-workflows checkout --quiet FETCH_HEAD
          { cat .ai-workflows/prompts/extractor.md; echo; cat issue.md; } > prompt.md
      - id: claude
        timeout-minutes: 5  # time limit; a timeout fails the job: `ai: error` (ADR-0050)
        uses: ./.ai-workflows/.github/actions/aiwf-agent
        with:
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt-file: prompt.md
          schema: .ai-workflows/schema/extractor.json
          max-turns: 3
          model: ${{ fromJSON(inputs.config).model || '' }}

  # Candidates with a read-only token, after checking pass 1's JSON against its schema: duplicate candidates from issue
  # search over all issues, possible fixes from commits and merged PRs since the reported version's tag (ADR-0035).
  candidates:
    needs: extract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      range_confidence: ${{ steps.gather.outputs.range_confidence }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ai-workflows
          persist-credentials: false
      - uses: ./.ai-workflows/.github/actions/aiwf-setup
      - id: gather
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          AIWF_CONFIG: ${{ inputs.config }}
          EXTRACT_JSON: ${{ needs.extract.outputs.json }}
        run: ~/.aiwf-venv/bin/aiwf triage-candidates --repo "$REPO" --issue "$ISSUE" --out context.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: triage-context
          path: context.md
          retention-days: 7

  # B1 pass 2 (classifier): class, duplicate, possible fix. No tools but StructuredOutput; issue and candidates inline.
  classify:
    needs: [context, candidates]
    if: needs.context.outputs.capped != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    outputs:
      json: ${{ steps.claude.outputs.structured_output }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: triage-context
      - env:
          AIWF_REPO: ${{ job.workflow_repository }}
          AIWF_SHA: ${{ job.workflow_sha }}
        run: |
          # Prompt and schema come from the commit this workflow file came from (ADR-0040), fetched without credentials.
          git init --quiet .ai-workflows
          git -C .ai-workflows fetch --quiet --depth 1 "https://github.com/$AIWF_REPO.git" "$AIWF_SHA"
          git -C .ai-workflows checkout --quiet FETCH_HEAD
          { cat .ai-workflows/prompts/classifier.md; echo; cat context.md; } > prompt.md
      - id: claude
        timeout-minutes: 10  # time limit; a timeout fails the job: `ai: error` (ADR-0050)
        uses: ./.ai-workflows/.github/actions/aiwf-agent
        with:
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt-file: prompt.md
          schema: .ai-workflows/schema/classifier.json
          max-turns: 3
          model: ${{ fromJSON(inputs.config).model || '' }}

  # Labels and the one triage comment, from the checked JSON; invalid output gives `ai: error` and nothing else.
  # A capped issue (ADR-0058) gets `triage: needs-human` and a fixed comment instead, with no agent output.
  publish:
    needs: [context, extract, candidates, classify]
    if: always() && needs.context.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read  # check a fixing commit is on the default branch
      issues: write
      pull-requests: read  # check a fixing PR was merged into the default branch
    outputs:
      alert_text: ${{ steps.publish.outputs.alert_text }}
      alert_url: ${{ steps.publish.outputs.alert_url }}
      reproduce: ${{ steps.publish.outputs.reproduce }}  # a trusted author's bug goes on to B2 (ADR-0037)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ai-workflows
          persist-credentials: false
      - uses: ./.ai-workflows/.github/actions/aiwf-setup
      - if: needs.context.outputs.capped == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: ~/.aiwf-venv/bin/aiwf triage-capped --repo "$REPO" --issue "$ISSUE"
      - id: publish
        if: needs.context.outputs.capped != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          AGENT_JSON: ${{ needs.classify.outputs.json }}
          EXTRACT_JSON: ${{ needs.extract.outputs.json }}  # its suspicious_instructions are reported too
          AIWF_CONFIG: ${{ inputs.config }}
          AIWF_FIX_RANGE_CONFIDENCE: ${{ needs.candidates.outputs.range_confidence }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ~/.aiwf-venv/bin/aiwf publish --kind classifier --repo "$REPO" --issue "$ISSUE" --run-url "$RUN_URL"

  # "New issue triaged" chat alert (spec: Chat notifications, WP11b1) to the config's `notify` channels: new issues only,
  # never on `/retriage`. Only a published classifier result sets the alert (a capped issue has none, ADR-0058); its
  # text holds checked fields only. The only job given the chat secrets, through env vars to the send step; no GitHub
  # token scope. aiwf notify never prints the secrets, the request URLs or the chat ID.
  notify:
    needs: publish
    if: github.event_name == 'issues' && github.event.action == 'opened' && needs.publish.outputs.alert_text != '' && fromJSON(inputs.config).notify != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ai-workflows
          persist-credentials: false
      - uses: ./.ai-workflows/.github/actions/aiwf-setup
      - env:
          CHANNELS: ${{ fromJSON(inputs.config).notify }}
          NOTIFY_TEXT: ${{ needs.publish.outputs.alert_text }}
          NOTIFY_URL: ${{ needs.publish.outputs.alert_url }}
          AIWF_SHA: ${{ job.workflow_sha }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: ~/.aiwf-venv/bin/aiwf notify --channels "$CHANNELS"

  # B2 context with a read-only token: the issue and the comments that matter, the project's commands, and the default
  # branch's code (persist-credentials false: no token is left in the tarball's .git). Pattern: docs/patterns.md.
  # Which events run B2 (ADR-0037), each its own clause: B1 publish handed on a trusted author's bug; `/reproduce` from a
  # maintainer (config.yml parsed the comment, ADR-0005); or the reporter's reply, a comment that is no command, by the
  # issue's author, while the issue has `triage: needs-info`, which only B2 sets, so only after a trusted start.
  repro-context:
    needs: publish
    if: >-
      ${{ !cancelled() && (
        needs.publish.outputs.reproduce == 'true'
        || (github.event_name == 'issue_comment' && !github.event.issue.pull_request
            && fromJSON(inputs.config).command == 'reproduce')
        || (github.event_name == 'issue_comment' && !github.event.issue.pull_request
            && fromJSON(inputs.config).command == ''
            && github.event.comment.user.login == github.event.issue.user.login
            && contains(github.event.issue.labels.*.name, 'triage: needs-info'))
      ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ai-workflows
          persist-credentials: false
      - uses: ./.ai-workflows/.github/actions/aiwf-setup
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: target
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          AIWF_CONFIG: ${{ inputs.config }}
        run: |
          ~/.aiwf-venv/bin/aiwf repro-context --repo "$REPO" --issue "$ISSUE" --out issue.md
          tar -czf target.tgz -C target .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repro-input
          path: |
            issue.md
            target.tgz
          retention-days: 7

  # B2 (reproducer): turns the report into a failing test by running project commands (ADR-0037). No GitHub token; the
  # only secret is the model token, kept from every command by the env scrub; every command runs in Claude Code's
  # sandbox (bubblewrap: writes only in work/ and the temp dir, egress only to `allowed_domains`, runner dirs unreadable),
  # with no fallback to unsandboxed commands. Tools: Bash and StructuredOutput only (Read, Edit, Write and WebFetch run
  # outside the sandbox); `--setting-sources user` ignores the target repo's .claude settings and hooks. No repo code runs
  # outside the agent in this job. The token check fails the job, without printing anything, if the token value appears
  # in the agent's answer or transcript; the answer is passed on only when that check succeeded. The `if` is required:
  # without a status check GitHub skips the job when any earlier job was skipped, e.g. `publish` on a `/reproduce`.
  reproduce:
    needs: repro-context
    if: ${{ !cancelled() && needs.repro-context.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions: {}
    env:
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"  # ADR-0037: no credential in any Bash command's environment
      CLAUDE_WORKING_DIR: ${{ github.workspace }}/work  # base-action runs Claude Code in the unpacked target code
    outputs:
      json: ${{ steps.token-check.outcome == 'success' && steps.claude.outputs.structured_output || '' }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: repro-input
      - env:
          AIWF_REPO: ${{ job.workflow_repository }}
          AIWF_SHA: ${{ job.workflow_sha }}
          DOMAINS: ${{ toJSON(fromJSON(inputs.config).allowed_domains) }}
        run: |
          # Prompt and schema come from the commit this workflow file came from (ADR-0019), fetched without credentials.
          git init --quiet .ai-workflows
          git -C .ai-workflows fetch --quiet --depth 1 "https://github.com/$AIWF_REPO.git" "$AIWF_SHA"
          git -C .ai-workflows checkout --quiet FETCH_HEAD
          { cat .ai-workflows/prompts/reproducer.md; echo; cat issue.md; } > prompt.md
          mkdir work && tar -xzf target.tgz -C work && rm target.tgz
          # Sandbox settings (ADR-0037), merged by base-action into the user settings that --setting-sources user loads.
          deny='[]'
          for d in "$RUNNER_TEMP" "$HOME/.claude" /home/runner/runners /home/runner/actions-runner /opt/actions-runner; do
            if [ -e "$d" ]; then deny=$(jq -c --arg d "$d" '. + [$d]' <<< "$deny"); fi
          done
          jq -n --argjson domains "$DOMAINS" --argjson deny "$deny" '{sandbox: {enabled: true, failIfUnavailable: true,
            allowUnsandboxedCommands: false, autoAllowBashIfSandboxed: true, network: {allowedDomains: $domains},
            filesystem: {denyRead: $deny}}}' > settings.json
      # The sandbox's requirements (ADR-0037); any failure fails the job: there is no unsandboxed fallback.
      - name: Sandbox setup
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # sandbox-settings gives the agent Bash (sandboxed, auto-allowed) and --setting-sources user (CP8 shared action).
      - id: claude
        timeout-minutes: 20  # time limit; a timeout fails the job: `ai: error` (ADR-0050)
        uses: ./.ai-workflows/.github/actions/aiwf-agent
        with:
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt-file: ${{ github.workspace }}/prompt.md
          schema: ${{ github.workspace }}/.ai-workflows/schema/reproducer.json
          max-turns: 40
          model: ${{ fromJSON(inputs.config).model || '' }}
          sandbox-settings: ${{ github.workspace }}/settings.json
      # ADR-0037 verification: the token value must not appear in the answer or the transcript. Prints nothing about it.
      - name: Token check
        id: token-check
        if: ${{ !cancelled() && steps.claude.outcome != 'skipped' }}
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          ANSWER: ${{ steps.claude.outputs.structured_output }}
        run: |
          [ -n "$TOKEN" ] || { echo "::error::no token to check against"; exit 1; }
          found=0
          if [ -n "$EXEC_FILE" ] && [ -f "$EXEC_FILE" ] && grep -qF -- "$TOKEN" "$EXEC_FILE"; then found=1; fi
          if printf '%s' "$ANSWER" | grep -qF -- "$TOKEN"; then found=1; fi
          if [ "$found" = 1 ]; then echo "::error title=Token check::the model token appears in the agent's output"; exit 1; fi
          echo "token check passed"

  # B2 labels and comment, from the checked JSON; invalid or missing output gives `ai: error` and nothing else.
  repro-publish:
    needs: [repro-context, reproduce]
    if: ${{ !cancelled() && needs.repro-context.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ai-workflows
          persist-credentials: false
      - uses: ./.ai-workflows/.github/actions/aiwf-setup
      - id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          AGENT_JSON: ${{ needs.reproduce.outputs.json }}
          AIWF_CONFIG: ${{ inputs.config }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ~/.aiwf-venv/bin/aiwf publish --kind reproducer --repo "$REPO" --issue "$ISSUE" --run-url "$RUN_URL"

  # A failed job (ADR-0045): `ai: error` and one sticky error comment with the run link; never retried. Skipped when a
  # job was cancelled (`ai: off`) and when nothing failed. An agent that hits its time limit fails its job (ADR-0050).
  # The reason names the failed jobs only.
  failed:
    needs: [context, extract, candidates, classify, publish, notify, repro-context, reproduce, repro-publish]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ai-workflows
          persist-credentials: false
      - uses: ./.ai-workflows/.github/actions/aiwf-setup
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ITEM: ${{ github.event.issue.number }}
          AIWF_NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ~/.aiwf-venv/bin/aiwf report-error --repo "$REPO" --issue "$ITEM" --run-url "$RUN_URL"
