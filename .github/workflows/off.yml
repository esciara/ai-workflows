# Reusable: the `ai: off` kill switch on an item (WP12a, ADR-0045). The caller runs it on `labeled` events for the
# label `ai: off`; it cancels the caller workflow's in-flight runs for that issue or PR. New runs are stopped by the
# config gate, and every write re-checks the live labels, so this only saves the usage of agents already running.
# The item title (untrusted) goes through env and is only compared, never executed or printed.
name: ai-workflows off
on:
  workflow_call:

# Least privilege by default (ADR-0017); each job grants what it needs.
permissions: {}

jobs:
  cancel:
    if: "github.event.action == 'labeled' && github.event.label.name == 'ai: off'"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write  # cancel runs; this job only (ADR-0045)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ai-workflows
          persist-credentials: false
      - id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - id: venv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.aiwf-venv
          key: aiwf-venv-v1-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('.ai-workflows/pyproject.toml') }}
      - if: steps.venv.outputs.cache-hit != 'true'
        run: python -m venv ~/.aiwf-venv && ~/.aiwf-venv/bin/pip install --quiet -e ./.ai-workflows
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ITEM: ${{ github.event.pull_request.number || github.event.issue.number }}
          ITEM_TITLE: ${{ github.event.pull_request.title || github.event.issue.title }}
        run: ~/.aiwf-venv/bin/aiwf cancel-runs --repo "$REPO" --run-id "$RUN_ID" --item "$ITEM"
