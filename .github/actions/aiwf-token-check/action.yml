# ADR-0037 verification after a command-running agent: the model token value must not appear in the agent's answer, its
# transcript or (implementer) the diff it produced. Prints nothing about the value. Fails the step on a match; the
# calling job gives the step `id: token-check` and `if: ${{ !cancelled() && steps.claude.outcome != 'skipped' }}`, and
# passes the answer on (and uploads the diff) only when `steps.token-check.outcome == 'success'`.
# `uses: ./.ai-workflows/.github/actions/aiwf-token-check`. The token is an input and is only compared, never echoed.
name: aiwf token check
description: Fail when the model token appears in an agent's output
inputs:
  token:
    description: CLAUDE_CODE_OAUTH_TOKEN
    required: true
  execution-file:
    description: The agent's execution log (aiwf-agent output execution_file)
    required: false
    default: ''
  answer:
    description: The agent's structured output
    required: false
    default: ''
  extra-file:
    description: Another file to scan, if it exists (the implementer's patch.diff)
    required: false
    default: ''
runs:
  using: composite
  steps:
    - shell: bash
      env:
        TOKEN: ${{ inputs.token }}
        EXEC_FILE: ${{ inputs.execution-file }}
        ANSWER: ${{ inputs.answer }}
        EXTRA_FILE: ${{ inputs.extra-file }}
      run: |
        [ -n "$TOKEN" ] || { echo "::error::no token to check against"; exit 1; }
        found=0
        if [ -n "$EXEC_FILE" ] && [ -f "$EXEC_FILE" ] && grep -qF -- "$TOKEN" "$EXEC_FILE"; then found=1; fi
        if printf '%s' "$ANSWER" | grep -qF -- "$TOKEN"; then found=1; fi
        if [ -n "$EXTRA_FILE" ] && [ -f "$EXTRA_FILE" ] && grep -qF -- "$TOKEN" "$EXTRA_FILE"; then found=1; fi
        if [ "$found" = 1 ]; then echo "::error title=Token check::the model token appears in the agent's output"; exit 1; fi
        echo "token check passed"
