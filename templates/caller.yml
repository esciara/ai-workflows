# .github/workflows/ai-workflows.yml in a TARGET repo.
# Events in, one call per reusable workflow out. Secrets are passed explicitly (never `inherit`).
# Each job grants the most its called workflow needs; the called jobs narrow it with their own `permissions:`.
# Replace @main with a branch or tag of esciara/ai-workflows if needed; scripts load from the same commit (ADR-0019).
name: AI workflows
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]
  issues:
    types: [opened]
  schedule:
    - cron: '17 5 * * *'          # daily jobs: labels sync, reporter silence (WP7)
  workflow_dispatch:
    inputs:
      config_ref:
        description: Validate the config from this ref instead of the default branch (diagnostics)
        type: string
        default: ''

concurrency:
  group: ai-workflows-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

# Least privilege by default (ADR-0017); every job below grants what its called workflow needs.
permissions: {}

jobs:
  config:
    uses: esciara/ai-workflows/.github/workflows/config.yml@main
    permissions:
      contents: read
    with:
      config_ref: ${{ inputs.config_ref || '' }}

  # Label set (ADR-0023): only on a manual run or the daily schedule. Run the workflow once by hand after install.
  labels:
    needs: config
    if: needs.config.outputs.enabled == 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    uses: esciara/ai-workflows/.github/workflows/labels.yml@main
    permissions:
      issues: write

  # Slash commands (WP1: /ping).
  commands:
    needs: config
    if: needs.config.outputs.enabled == 'true' && github.event_name == 'issue_comment'
    uses: esciara/ai-workflows/.github/workflows/commands.yml@main
    permissions:
      contents: read
      issues: write
      pull-requests: write
    with:
      config: ${{ needs.config.outputs.config }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  # Workflow A (WP2a: core review; /review on PR comments arrives in WP4).
  review:
    needs: config
    if: needs.config.outputs.review == 'true' && (github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && github.event.issue.pull_request))
    uses: esciara/ai-workflows/.github/workflows/review.yml@main
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: read
    with:
      config: ${{ needs.config.outputs.config }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  # Workflow B (WP5+): enabled once triage.yml exists.
