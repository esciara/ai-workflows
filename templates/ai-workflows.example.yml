# .github/ai-workflows.yml — per-repo configuration. Schema: schema/ai-workflows.schema.json.
# Read from the repo's default branch only. Only `maintainers` is required; the rest shows the defaults or examples.
# "not used yet, WPx": accepted and validated, but nothing reads it until that work package (docs/plan.md) is built.
enabled: true                   # repo kill switch: false stops every run
maintainers: [<OWNER>]          # B4 questions, assignments, pings, allowed command authors
default_branch: main
setup: npm ci                   # how an agent installs the project in its sandbox
test: npm test                  # B2 repro and B5 exit condition
allowed_domains: [registry.npmjs.org]   # sandbox egress for setup/test (B2, B5); default [] = no network
risk_paths:                     # unmatched paths are low risk
  high: ["src/auth/**", "migrations/**", ".github/**", "infra/**"]
  medium: []
limits:
  human_review_lines: 400
  fix_rounds: 3                 # not used yet, WP9
  info_requests: 2              # B2 questions to the reporter before triage: needs-human
  triage_per_author_per_day: 3  # B1 runs per outside author (not in maintainers) per 24 hours; 0 = never (ADR-0058)
  triage_per_day: 20            # B1 runs for all outside authors per 24 hours; 0 = never (ADR-0058)
reporter_silence_days: {ping: 4, stale: 14, close: 21}   # days after B2 asks: ping maintainers, stale, close; increasing, decimals allowed
notify: none                    # none | slack | telegram | slack,telegram; new-issue alert now, other events later (WP11b)
fork_prs: on-command            # on-command (review fork PRs only after /review) | off
workflows:
  review: true                  # Workflow A
  triage: false                 # Workflow B (enable after M2)
# linked_issue: issue            # issue (a PR needs a linked issue, e.g. `Fixes #N`, else ai-review: human-review) | issue-or-plan-ref (a WP id or docs/plan.md in the PR text also counts; WP branches then need e2e run IDs, ADR-0053)
# model: claude-sonnet-4-5      # optional model override for agent runs
# required_checks: [test]       # optional; default: CI gate waits on all checks on the head SHA except ours
